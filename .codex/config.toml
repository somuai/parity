# Codex CLI project config.
#
# approval_policy is deliberately NOT set here. It was set to "untrusted"
# in an earlier draft -- a value your own Codex build had explicitly
# listed as valid one session earlier -- and a later session rejected it
# outright: "approval_policy is no longer supported; remove this setting."
# That's the config schema changing between sessions, not a typo to
# re-guess. Pinning a fast-moving field in a committed file means every
# future schema change breaks the repo again the same way.
#
# The safer, schema-drift-proof approach: control approval mode with a CLI
# flag at launch, not a file. Check your exact current flag and accepted
# values with `codex --help` before each session if unsure -- the most
# recently confirmed example (developers.openai.com/codex/agent-approvals-security)
# was `--ask-for-approval on-request` alongside `--sandbox workspace-write`.
# If that flag name has also changed by the time you read this, `codex
# --help` is the ground truth, not this comment.
#
# Default to the most conservative approval behavior your version offers
# (review everything) for any phase touching money-shaped logic (Tier 2,
# audit, hardening). Never use a full-auto / no-approval mode on this repo
# -- AGENTS.md rule 6.
#
# sandbox_mode and network_access below are a SEPARATE control from
# approval -- they govern what Codex is technically able to do, not when
# it must ask. These haven't errored yet, but given the pattern above,
# verify them too if a session rejects this file: `codex --help` or your
# installed version's docs are more current than this comment can be.

model = "gpt-5.6"                 # swap to a mini variant for narrow subagent tasks
model_provider = "openai"
sandbox_mode = "workspace-write"  # can edit files in this repo; cannot touch anything
                                    # outside it or reach the network unless enabled below

[sandbox_workspace_write]
network_access = false            # default OFF -- enable per-session with
                                    # -c sandbox_workspace_write.network_access=true
                                    # for the specific phases that need it (see each
                                    # phase's prompt file)

[agents]
max_threads = 8                    # Phase 5 spawns exactly 6 subagents -- default (6)
                                    # leaves zero headroom, so this is raised deliberately
max_depth = 1                      # no subagent spawns its own sub-subagents in this build
